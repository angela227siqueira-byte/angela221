<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · Independências da América · 30 questões</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 85%;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
            padding: 20px 30px;
            border: 1px solid #dde5e0;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #0f3d2e;
            margin-bottom: 12px;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #2a5e4a;
            margin-bottom: 20px;
            font-style: italic;
        }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .question-text img {
            max-width: 100%;
            border-radius: 12px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: block;
            max-height: 300px;
        }
        .options { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .opt-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.1s;
        }
        .opt-btn.selected { background: #1a5e44; color: white; border-color: #1a5e44; }
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .toolbar { display: flex; justify-content: space-between; gap: 12px; margin: 20px 0 10px; }
        .tool-btn {
            background: #ecf3ef; border: 1px solid #b3cdbf; padding: 12px; font-size: 1rem;
            border-radius: 48px; flex: 1; text-align: center; cursor: pointer;
        }
        .progress { font-size: 0.85rem; margin-bottom: 8px; color: #1a5e44; text-align: right; }
        .font-controls { display: flex; gap: 8px; margin-bottom: 15px; justify-content: flex-end; }
        .font-btn {
            background: #e6f0ea; border: none; padding: 6px 12px; border-radius: 40px; cursor: pointer; font-weight: bold;
        }
        .result-screen { text-align: center; }
        .result-box { background: #f0f7f3; padding: 20px; border-radius: 28px; margin: 20px 0; }
        .restart-btn {
            background: #1a5e44; color: white; border: none; padding: 14px; border-radius: 60px; width: 100%; cursor: pointer; margin-top: 10px;
        }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        @media (max-width: 640px) { .quiz-wrapper { max-width: 100%; padding: 15px; } .opt-btn { padding: 8px 16px; } }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <div id="quizScreen" class="screen active">
        <div class="font-controls">
            <button class="font-btn" id="fontMinus">A−</button>
            <button class="font-btn" id="fontPlus">A+</button>
            <button class="font-btn" id="fullscreenBtn">⛶ Tela cheia</button>
        </div>
        <div class="title">📜 Processos de Independência nas Américas</div>
        <div class="sub">Capítulo 9 · EUA, América Espanhola e Brasil · 30 questões</div>
        <div class="progress" id="progressText">Questão 1 de 30</div>
        <div id="questionArea">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsArea"></div>
            <div class="feedback" id="feedbackArea" style="display: none;"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    const questions = [
        // --- EUA ---
        {
            type: 'tf',
            text: "As ideias iluministas que influenciaram as independências americanas defendiam o absolutismo monárquico e a divisão estamental da sociedade.",
            correct: false,
            justification: "O Iluminismo criticava exatamente o absolutismo monárquico e a divisão estamental, defendendo a liberdade, a igualdade jurídica e a soberania popular."
        },
        {
            type: 'mc',
            text: "A 'negligência salutar' que caracterizou a relação entre a Inglaterra e as Treze Colônias no século XVII significava:",
            correct: 1,
            options: [
                "Rigoroso controle militar e fiscal da metrópole",
                "Pouca interferência britânica, permitindo autonomia aos colonos",
                "Proibição total do comércio marítimo",
                "Envio de tropas para controlar rebeliões indígenas"
            ],
            justification: "A negligência salutar foi um período de controle menos rígido por parte da Inglaterra, o que permitiu às colônias desenvolver autonomia política e econômica."
        },
        {
            type: 'tf',
            text: "A Guerra dos Sete Anos (1756-1763) fortaleceu a economia da metrópole britânica, que reduziu impostos sobre as Treze Colônias.",
            correct: false,
            justification: "Ao contrário: a guerra endividou a Inglaterra, que passou a cobrar mais impostos e reforçar o controle sobre as colônias, gerando insatisfação."
        },
        {
            type: 'mc',
            text: "O Boston Tea Party (Festa do Chá de Boston), em 1773, foi uma reação dos colonos contra:",
            correct: 2,
            options: [
                "O aumento do preço do açúcar",
                "A proibição da escravidão",
                "O monopólio da Companhia Britânica das Índias Orientais sobre o comércio de chá",
                "A invasão francesa ao território colonial"
            ],
            justification: "A Lei do Chá concedeu vantagens à Companhia Britânica das Índias Orientais para monopolizar o comércio de chá. Os colonos reagiram destruindo carregamentos no porto de Boston."
        },
        {
            type: 'tf',
            text: "A Declaração de Independência dos Estados Unidos, aprovada em 4 de julho de 1776, teve como principal redator Thomas Jefferson e foi inspirada nas ideias de John Locke.",
            correct: true,
            justification: "Thomas Jefferson liderou a comissão que redigiu o documento, fortemente influenciado pelas ideias liberais de Locke sobre direitos naturais e contrato social."
        },
        {
            type: 'mc',
            text: "Uma das contradições da Declaração de Independência dos EUA foi:",
            correct: 1,
            options: [
                "Estabelecer o voto universal masculino e feminino",
                "Proclamar que 'todos os homens são criados iguais' mantendo a escravidão",
                "Defender o direito divino dos reis",
                "Garantir cidadania plena aos povos indígenas"
            ],
            justification: "O documento proclamava igualdade e liberdade, mas excluía mulheres, indígenas e, principalmente, mantinha a escravidão africana."
        },
        {
            type: 'tf',
            text: "A Constituição dos Estados Unidos (1787) estabeleceu uma república federativa com separação em três poderes: Executivo, Legislativo e Judiciário.",
            correct: true,
            justification: "A Constituição criou a república federativa com três poderes independentes (freios e contrapesos), sendo o primeiro presidente George Washington."
        },
        {
            type: 'mc',
            text: "<img src='https://static.planejativo.com/uploads/images/2023/07/ZhFSxJLsFyhIftz6.png' alt='Divisão dos poderes'><br>O esquema representa qual característica da Constituição dos EUA?",
            correct: 0,
            options: [
                "A divisão do poder em três esferas independentes",
                "A concentração do poder no presidente",
                "O direito divino dos governantes",
                "A ausência de um Poder Judiciário"
            ],
            justification: "A separação dos poderes é um princípio iluminista fundamental adotado pela Constituição americana."
        },
        {
            type: 'tf',
            text: "A independência dos EUA foi reconhecida pela Inglaterra em 1776, logo após a Declaração de Independência.",
            correct: false,
            justification: "O reconhecimento formal ocorreu apenas em 1783, pelo Tratado de Paris, após a vitória militar dos colonos com apoio francês e espanhol."
        },
        // --- AMÉRICA ESPANHOLA ---
        {
            type: 'tf',
            text: "As Reformas Bourbônicas, promovidas pela Coroa espanhola no século XVIII, reduziram os impostos coloniais e ampliaram a autonomia das elites criollas.",
            correct: false,
            justification: "As reformas aumentaram os impostos e o controle metropolitano sobre as colônias, gerando descontentamento tanto da elite criolla quanto das camadas populares."
        },
        {
            type: 'mc',
            text: "Na América Espanhola, os criollos eram:",
            correct: 2,
            options: [
                "Espanhóis peninsulares que ocupavam cargos administrativos",
                "Escravizados africanos libertos",
                "Descendentes de espanhóis nascidos na América, que compunham a elite local",
                "Indígenas convertidos ao catolicismo"
            ],
            justification: "Os criollos eram a elite econômica nascida na América, mas excluída dos principais cargos políticos, reservados aos espanhóis peninsulares."
        },
        {
            type: 'tf',
            text: "A invasão da Espanha por Napoleão Bonaparte em 1808 e a prisão do rei Fernando VII criaram um vácuo de poder que favoreceu os movimentos de independência na América Espanhola.",
            correct: true,
            justification: "Com o rei preso, formaram-se juntas de governo nas colônias que, inicialmente leais ao rei deposto, evoluíram para movimentos de independência."
        },
        {
            type: 'mc',
            text: "Simón Bolívar sonhava com uma América unida, projeto que resultou na criação temporária da:",
            correct: 0,
            options: [
                "Grã-Colômbia",
                "Confederação Pan-Americana",
                "República das Províncias Unidas",
                "Aliança dos Libertadores"
            ],
            justification: "A Grã-Colômbia uniu Venezuela, Nova Granada (Colômbia) e Equador, mas se fragmentou entre 1830 e 1831."
        },
        {
            type: 'mc',
            text: "<img src='https://i0.wp.com/sga.uniube.br/aulas/ftp/c700/d700082/a02/imgs/t3.1.jpg' alt='Campanhas de Bolívar e San Martín'><br>O mapa mostra as rotas de independência lideradas por Bolívar (norte) e San Martín (sul). Qual foi a contribuição de San Martín?",
            correct: 1,
            options: [
                "Liderou a independência do México",
                "Conduziu o Exército dos Andes para libertar Chile e Peru",
                "Proclamou a república no Haiti",
                "Negociou a independência do Brasil"
            ],
            justification: "José de San Martín partiu da Argentina, atravessou os Andes e liderou a independência do Chile e do Peru."
        },
        {
            type: 'tf',
            text: "No México, a independência foi liderada exclusivamente pela elite criolla, sem participação popular.",
            correct: false,
            justification: "Os padres Miguel Hidalgo e José María Morelos lideraram milhares de indígenas e mestiços. Após serem derrotados, a elite criolla concluiu a independência com Agustín de Iturbide em 1821."
        },
        {
            type: 'mc',
            text: "O Haiti foi uma exceção na América porque sua independência (1804):",
            correct: 3,
            options: [
                "Foi obtida por negociação pacífica com a França",
                "Manteve a monarquia francesa",
                "Resultou na anexação do território aos EUA",
                "Foi liderada por escravizados e ex-escravizados, derrotando o exército francês"
            ],
            justification: "Sob a liderança de Toussaint L'Ouverture e Jean-Jacques Dessalines, os escravizados derrotaram os franceses, tornando o Haiti a primeira república negra do mundo."
        },
        {
            type: 'tf',
            text: "Após as independências, a maior parte dos países latino-americanos adotou a república como forma de governo, com exceção do Brasil, que manteve a monarquia.",
            correct: true,
            justification: "Enquanto as ex-colônias espanholas e os EUA adotaram repúblicas, o Brasil singularizou-se ao manter a monarquia e a dinastia de Bragança no poder."
        },
        {
            type: 'mc',
            text: "Mulheres como Leona Vicario (México), Policarpa Salavarrieta (Colômbia) e Manuela Sáenz (Equador) atuaram nas independências principalmente como:",
            correct: 1,
            options: [
                "Comandantes supremas dos exércitos",
                "Informantes, mensageiras, articuladoras políticas e combatentes",
                "Diplomatas nas cortes europeias",
                "Assinantes das declarações de independência"
            ],
            justification: "As mulheres participaram ativamente nas lutas, seja nos campos de batalha, seja em redes de espionagem, apoio logístico e difusão de ideias."
        },
        // --- BRASIL ---
        {
            type: 'tf',
            text: "Com a transferência da Corte portuguesa para o Rio de Janeiro em 1808, o Brasil deixou oficialmente de ser colônia e tornou-se sede do Império Português.",
            correct: true,
            justification: "A vinda da família real transformou o Rio de Janeiro em capital do império, pondo fim ao pacto colonial e abrindo os portos às nações amigas."
        },
        {
            type: 'mc',
            text: "A elevação do Brasil a Reino Unido a Portugal e Algarves, em 1815, significou:",
            correct: 3,
            options: [
                "A independência imediata do Brasil",
                "O retorno de D. João VI a Portugal",
                "A proibição do tráfico de escravizados",
                "O fim do status colonial, igualando juridicamente o Brasil a Portugal"
            ],
            justification: "Com a elevação a Reino Unido, o Brasil deixou formalmente de ser colônia e passou a ter o mesmo status jurídico de Portugal."
        },
        {
            type: 'tf',
            text: "A Revolução Pernambucana de 1817 foi um movimento republicano que contestou o domínio de D. João VI e os altos impostos cobrados na região.",
            correct: true,
            justification: "Comerciantes, proprietários, clérigos e militares proclamaram uma república em Pernambuco, mas o movimento foi violentamente reprimido em pouco mais de dois meses."
        },
        {
            type: 'mc',
            text: "A Revolução Liberal do Porto (1820) exigia, entre outras coisas:",
            correct: 2,
            options: [
                "A independência do Brasil",
                "A abolição imediata da escravidão",
                "O retorno de D. João VI a Portugal e a recolonização do Brasil",
                "A adoção do regime republicano no Brasil"
            ],
            justification: "Os revolucionários portugueses queriam que o rei voltasse a Lisboa e tentaram restabelecer o pacto colonial com o Brasil (recolonização)."
        },
        {
            type: 'mc',
            text: "<img src='https://c.files.bbci.co.uk/58C0/production/_123902722_dompedro3.jpg' alt='Dom Pedro'><br>O 'Dia do Fico' (9 de janeiro de 1822) marcou:",
            correct: 1,
            options: [
                "A proclamação da independência do Brasil",
                "A decisão de D. Pedro de permanecer no Brasil, contrariando as Cortes portuguesas",
                "A coroação de D. Pedro como imperador",
                "A assinatura da Constituição de 1824"
            ],
            justification: "Pressionado por uma petição com 8 mil assinaturas, D. Pedro declarou que permaneceria no Brasil ('Diga ao povo que fico')."
        },
        {
            type: 'tf',
            text: "O decreto do 'Cumpra-se' determinava que as leis aprovadas pelas Cortes de Lisboa só teriam validade no Brasil após aprovação de D. Pedro.",
            correct: true,
            justification: "Em maio de 1822, D. Pedro decretou que as leis portuguesas só vigorariam no Brasil com sua autorização, reforçando a autonomia brasileira."
        },
        {
            type: 'tf',
            text: "A independência do Brasil foi proclamada em 7 de setembro de 1822 e foi imediatamente aceita em todas as províncias, sem conflitos armados.",
            correct: false,
            justification: "Houve resistência armada em províncias como Bahia, Piauí, Maranhão, Pará e Cisplatina, com combates que se estenderam até 1823."
        },
        {
            type: 'mc',
            text: "A consolidação do Estado brasileiro após a independência manteve como característica marcante:",
            correct: 2,
            options: [
                "O regime republicano presidencialista",
                "A abolição imediata da escravidão",
                "A monarquia constitucional e a manutenção da escravidão",
                "O direito de voto para todos os homens e mulheres"
            ],
            justification: "O Brasil manteve a monarquia (D. Pedro I) e a escravidão, com voto censitário restrito a homens com renda comprovada."
        },
        {
            type: 'tf',
            text: "O haitianismo foi o medo que as elites escravistas americanas tinham de que ocorressem revoltas de escravizados semelhantes à do Haiti.",
            correct: true,
            justification: "A independência do Haiti, liderada por escravizados, gerou pânico entre as elites escravistas da América, que temiam levantes semelhantes em seus territórios."
        },
        {
            type: 'mc',
            text: "<img src='https://upload.wikimedia.org/wikipedia/commons/8/86/Jean-Baptiste_Debret_-_Negros_vendedores_de_aves%2C_1823.jpg' alt='Debret'><br>A gravura de Debret (1823), mostrando escravizados no Rio de Janeiro um ano após a independência, indica que:",
            correct: 0,
            options: [
                "A independência não alterou a condição da população escravizada",
                "A escravidão havia sido abolida com a independência",
                "O Brasil já era uma república igualitária",
                "Apenas estrangeiros eram escravizados"
            ],
            justification: "A imagem evidencia que a estrutura social e econômica baseada na escravidão permaneceu intacta após a independência."
        },
        {
            type: 'mc',
            text: "O pan-americanismo, defendido por Simón Bolívar, propunha:",
            correct: 3,
            options: [
                "A fragmentação da América em pequenas repúblicas",
                "A anexação da América Latina pelos EUA",
                "O retorno ao domínio colonial espanhol",
                "A união dos países americanos em uma confederação para defesa mútua"
            ],
            justification: "Bolívar sonhava com uma grande confederação americana. O Congresso do Panamá (1826) discutiu essa ideia, que acabou não se concretizando."
        }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let userJustification = new Array(total).fill(null);

    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const questionText = document.getElementById('questionText');
    const optionsArea = document.getElementById('optionsArea');
    const feedbackArea = document.getElementById('feedbackArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const resultContent = document.getElementById('resultContent');
    const fontMinus = document.getElementById('fontMinus');
    const fontPlus = document.getElementById('fontPlus');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let currentFontSize = 16;
    function setFontSize(size) {
        document.querySelector('.quiz-wrapper').style.fontSize = size + 'px';
        const els = document.querySelectorAll('.question-text, .feedback, .opt-btn, .tool-btn, .restart-btn');
        els.forEach(el => el.style.fontSize = size + 'px');
        currentFontSize = size;
    }
    fontMinus.addEventListener('click', () => setFontSize(Math.max(12, currentFontSize-2)));
    fontPlus.addEventListener('click', () => setFontSize(Math.min(36, currentFontSize+2)));
    fullscreenBtn.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerHTML = `${currentIndex+1}. ${q.text}`;
        feedbackArea.style.display = 'none';
        feedbackArea.className = 'feedback';
        optionsArea.innerHTML = '';

        if (q.type === 'tf') {
            const btnTrue = document.createElement('button');
            btnTrue.className = 'opt-btn';
            btnTrue.dataset.value = 'true';
            btnTrue.textContent = '✅ Verdadeiro';
            const btnFalse = document.createElement('button');
            btnFalse.className = 'opt-btn';
            btnFalse.dataset.value = 'false';
            btnFalse.textContent = '❌ Falso';
            optionsArea.appendChild(btnTrue);
            optionsArea.appendChild(btnFalse);
        } else if (q.type === 'mc') {
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.dataset.value = idx.toString();
                btn.textContent = opt;
                optionsArea.appendChild(btn);
            });
        }

        const answer = userAnswers[currentIndex];
        if (answer !== null) {
            const allBtns = optionsArea.querySelectorAll('.opt-btn');
            allBtns.forEach(btn => {
                const btnVal = q.type === 'tf' ? (btn.dataset.value === 'true') : parseInt(btn.dataset.value);
                if (btnVal === answer) btn.classList.add('selected');
            });
            if (userJustification[currentIndex]) {
                const isCorrect = (q.type === 'tf') ? (answer === q.correct) : (answer === q.correct);
                feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
                feedbackArea.style.display = 'block';
                feedbackArea.innerHTML = userJustification[currentIndex];
            }
        }

        progressText.innerText = `Questão ${currentIndex+1} de ${total}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
    }

    function selectAnswer(valueStr) {
        const q = questions[currentIndex];
        let answerValue;
        if (q.type === 'tf') {
            answerValue = (valueStr === 'true');
        } else {
            answerValue = parseInt(valueStr);
        }
        userAnswers[currentIndex] = answerValue;

        const isCorrect = (q.type === 'tf') ? (answerValue === q.correct) : (answerValue === q.correct);
        const correctText = q.type === 'tf' ? (q.correct ? 'Verdadeiro' : 'Falso') : q.options[q.correct];
        const explanation = `<strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>Justificativa: ${q.justification}<br><span style="font-size:0.9rem;">Resposta correta: ${correctText}.</span>`;
        userJustification[currentIndex] = explanation;
        feedbackArea.classList.remove('correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.style.display = 'block';
        feedbackArea.innerHTML = explanation;

        const allBtns = optionsArea.querySelectorAll('.opt-btn');
        allBtns.forEach(btn => {
            btn.classList.remove('selected');
            const btnVal = q.type === 'tf' ? (btn.dataset.value === 'true') : parseInt(btn.dataset.value);
            if (btnVal === answerValue) btn.classList.add('selected');
        });
    }

    optionsArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (btn) selectAnswer(btn.dataset.value);
    });
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total-1) { currentIndex++; renderQuestion(); }
        else mostrarResultado();
    });

    function mostrarResultado() {
        let acertos = 0, erros = 0;
        for (let i = 0; i < total; i++) {
            const ans = userAnswers[i];
            const q = questions[i];
            if (ans !== null) {
                if ((q.type === 'tf' && ans === q.correct) || (q.type === 'mc' && ans === q.correct)) acertos++;
                else erros++;
            }
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;
        let mensagem = '';
        if (percentual >= 85) mensagem = '⭐ Excelente! Você domina os processos de independência da América.';
        else if (percentual >= 70) mensagem = '👍 Muito bom! Revise as diferenças entre os processos de independência.';
        else if (percentual >= 50) mensagem = '📘 Bom, mas retome o estudo das independências da América Espanhola.';
        else mensagem = '📚 Recomendo reler o capítulo 9 do livro didático.';

        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${erros}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <hr style="margin: 15px 0;">
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    restartQuizBtn.addEventListener('click', () => {
        userAnswers = new Array(total).fill(null);
        userJustification = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    renderQuestion();
    setFontSize(16);
</script>
</body>
</html>
